spring.application.name=gismetadatacrawler

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/gismetadata}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}

spring.sql.init.mode=never

logging.level.org.example.gismetadata=INFO

gismetadatacrawler.arcgis.root-url=${ARCGIS_ROOT_URL:https://maps.etcog.org/arcgis/rest/services}

gismetadatacrawler.openai.api-key=${OPENAI_API_KEY:}
gismetadatacrawler.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
gismetadatacrawler.embeddings.batch-size=${EMBEDDING_BATCH_SIZE:1000}
gismetadatacrawler.embeddings.max-total-records=${EMBEDDING_MAX_TOTAL_RECORDS:30000}

gismetadatacrawler.county-loader.shapefile-path=${COUNTY_SHAPEFILE_PATH:/Users/nidhishnair/Documents/spatial/tl_2025_us_county/tl_2025_us_county.shp}
gismetadatacrawler.county-loader.table-name=${COUNTY_TABLE_NAME:us_counties}
gismetadatacrawler.county-loader.ogr2ogr-path=${OGR2OGR_PATH:/opt/homebrew/bin/ogr2ogr}
gismetadatacrawler.county-loader.mode=${COUNTY_LOAD_MODE:overwrite}

gismetadatacrawler.neo4j.uri=${NEO4J_URI:bolt://localhost:7687}
gismetadatacrawler.neo4j.username=${NEO4J_USERNAME:neo4j}
gismetadatacrawler.neo4j.password=${NEO4J_PASSWORD:}
gismetadatacrawler.neo4j.database=${NEO4J_DATABASE:neo4j}
gismetadatacrawler.neo4j.batch-size=${NEO4J_BATCH_SIZE:500}

gismetadatacrawler.gis-discovery.provider=${GIS_DISCOVERY_PROVIDER:vertex}
gismetadatacrawler.gis-discovery.model=${GIS_DISCOVERY_MODEL:gpt-4.1}
gismetadatacrawler.gis-discovery.state-name=Texas
gismetadatacrawler.gis-discovery.statefp=48
gismetadatacrawler.gis-discovery.max-targets=${GIS_DISCOVERY_MAX_TARGETS:50}
gismetadatacrawler.gis-discovery.vertex-project-id=${GOOGLE_CLOUD_PROJECT:}
gismetadatacrawler.gis-discovery.vertex-location=${GOOGLE_CLOUD_LOCATION:us-central1}
gismetadatacrawler.gis-discovery.vertex-model=${VERTEX_GIS_DISCOVERY_MODEL:gemini-2.5-flash}
gismetadatacrawler.gis-discovery.vertex-api-key=${GOOGLE_GENAI_API_KEY:}